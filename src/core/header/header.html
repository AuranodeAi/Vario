<header class="app-header">
  
  <div class="header-section left">
    <img src="images/AuraNodaAi.png" alt="AuraNodeAI Logo" class="brand-logo" />
    <h1 class="brand-name">Varity</h1>
  </div>

  <div class="header-section center">
    <h2 class="org-name">AuraNode AI</h2>
  </div>

  <div class="header-section right">
    <div class="profile-menu" (click)="toggleMenu()">
       <!-- <img src="" alt="Admin" class="avatar" />  -->
      <i class="pi pi-user" style="font-size: 1.5rem"></i>
      <span class="username">Admin User</span>
      <i class="pi pi-chevron-down dropdown-icon"></i>
      
      <div class="dropdown-content" [class.show]="isMenuOpen" >
        <a href="#"><i class="pi pi-user"></i> My Profile</a>
        <a href="#"><i class="pi pi-cog"></i> Settings</a>
        <div class="divider"></div>
        <a href="#" class="logout-text"><i class="pi pi-sign-out"></i> Logout</a>
      </div>
    </div>
  </div>

</header>
