<div class="login-wrapper">
  <div class="login-card">
    
    <div class="login-header">
      <div class="logo-container">
        <i class="pi pi-box brand-icon"></i>
      </div>
      <h1 class="brand-name">Vario</h1>
      <p class="brand-tagline">Billing & Stock Management</p>
    </div>

    <form class="login-form">
      
      <div class="floating-input-group">
        <i class="pi pi-envelope input-icon"></i>
        <input type="email" id="email" class="floating-input" placeholder=" " required autocomplete="email" />
        <label for="email" class="floating-label">Email address</label>
      </div>

      <div class="floating-input-group">
        <i class="pi pi-lock input-icon"></i>
        <input type="password" id="password" class="floating-input" placeholder=" " required />
        <label for="password" class="floating-label">Password</label>
      </div>

      <div class="form-actions">
        <label class="checkbox-container">
          <input type="checkbox" />
          <span class="checkmark"></span>
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn" (click)="signIn()">
        <span>Sign In</span>
        <i class="pi pi-sign-in"></i>
      </button>

    </form>
  </div>
</div>
