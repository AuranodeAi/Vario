name: Build and Deploy Vario
on:
  push:
    branches:
      - QA  # Or whatever your primary branch is called
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npx ng build --configuration production --base-href "/Vario/"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/vario # The folder created by the build
          branch: gh-pages   # The "live" branch GitHub will use