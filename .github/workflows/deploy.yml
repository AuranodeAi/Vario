name: Build and Deploy Vario
on:
  push:
    branches:
      - QA
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Updated from v3

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Updated from v3
        with:
          node-version: '24' # Updated to the modern standard

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npx ng build --configuration production --base-href "/Vario/"

      - name: Fix for Angular Routing (404)
        # This copies index.html to 404.html so refreshes work on GitHub Pages
        run: cp dist/vario/browser/index.html dist/vario/browser/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/vario/browser # Most modern Angular versions build into a /browser subfolder
          branch: gh-pages
