name: Build and Deploy Vario
on:
  push:
    branches:
      - QA
# THIS IS THE FIX: Set the environment variable for the whole workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Set the build environment to Node 24

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        # Ensure base-href matches your repo name 'Vario'
        run: npx ng build --configuration production --base-href "/Vario/"

      - name: Fix for Angular Routing (404)
        # Standard Angular builds go to dist/project-name/browser
        run: cp dist/vario/browser/index.html dist/vario/browser/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/vario/browser 
          branch: gh-pages
